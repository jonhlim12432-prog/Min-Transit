    <script>
      (function() {
        // Complete override for Vite HMR WebSocket in iframe preview environments
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          class DummyWebSocket {
            readyState = 3; // CLOSED
            bufferedAmount = 0;
            extensions = '';
            protocol = '';
            binaryType = 'blob';
            url = '';
            onopen = null;
            onmessage = null;
            onerror = null;
            onclose = null;

            constructor(url, protocols) {
              this.url = String(url || '');
              if (this.url.includes('vite') || this.url.includes('ws://') || this.url.includes('wss://')) {
                setTimeout(() => {
                  if (typeof this.onclose === 'function') {
                    try {
                      this.onclose({ wasClean: true, code: 1000, reason: 'HMR Disabled' });
                    } catch {}
                  }
                }, 10);
                return;
              }
              return new NativeWebSocket(url, protocols);
            }

            send() {}
            close() {}
            addEventListener() {}
            removeEventListener() {}
            dispatchEvent() { return true; }
          }

          DummyWebSocket.CONNECTING = 0;
          DummyWebSocket.OPEN = 1;
          DummyWebSocket.CLOSING = 2;
          DummyWebSocket.CLOSED = 3;

          window.WebSocket = DummyWebSocket;
        }

        // Silence console logs and error popups for Vite HMR
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => String(a?.message || a)).join(' ');
          if (
            (msg.includes('[vite]') && (msg.includes('websocket') || msg.includes('WebSocket'))) ||
            msg.includes('WebSocket closed without opened')
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          const msg = args.map(a => String(a?.message || a)).join(' ');
          if (
            (msg.includes('[vite]') && (msg.includes('websocket') || msg.includes('WebSocket'))) ||
            msg.includes('WebSocket closed without opened')
          ) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (
            (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client') || event.message.includes('createWebSocketModuleRunnerTransport'))) ||
            (event.filename && event.filename.includes('@vite/client'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            (String(event.reason).includes('WebSocket') || String(event.reason).includes('@vite/client') || String(event.reason).includes('createWebSocketModuleRunnerTransport'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
